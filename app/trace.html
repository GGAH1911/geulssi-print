<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>글씨 연습장 - 화면에 쓰기</title>
<style>
  @font-face { font-family: 'Badasseugi'; src: url('../assets/fonts/HakgyoansimBadasseugi-L.ttf') format('truetype'); }
  @font-face { font-family: 'Bareun'; src: url('../assets/fonts/HakgyoansimBareondotum-R.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Bareun'; src: url('../assets/fonts/HakgyoansimBareondotum-B.ttf') format('truetype'); font-weight: 700; }

  :root {
    --bg: #f4f1e8; --paper: #fffdf8; --ink: #1f2a44; --line: #5b5b5b; --guide: #9db3c8;
    --trace: #cfcfcf; --accent: #2f6f4f; --accent-soft: #e3efe7; --warn: #c0612b;
    --trace-size: .792;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #222;
               font-family: 'Bareun', 'Apple SD Gothic Neo', sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 10px 16px; background: #fff; color: #222;
           font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.18); cursor: pointer; min-height: 44px; }
  button.primary { background: var(--accent); color: #fff; }
  button.on { background: var(--warn); color: #fff; }
  button:disabled { opacity: .45; }
  [hidden] { display: none !important; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); }
  .bar .grow { flex: 1; min-width: 0; }
  .model { font-family: 'Badasseugi'; font-size: 30px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 520px) {
    .bar { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .bar button { padding: 8px 10px; font-size: 14px; }
    .model { font-size: 22px; }
    .prog { font-size: 12px; }
    .hint { font-size: 13px; }
  }
  .prog { font-size: 14px; color: #666; white-space: nowrap; }
  .hint { font-size: 15px; color: #555; }

  #stage { flex: 1; position: relative; min-height: 0; }
  #sheet { position: absolute; }
  .cell { position: absolute; background: var(--paper); box-shadow: inset 0 0 0 2px var(--line); }
  .cell::before, .cell::after { content: ''; position: absolute; pointer-events: none; }
  .cell::before { left: 50%; top: 0; bottom: 0; border-left: 1.5px dashed var(--guide); }
  .cell::after  { top: 50%; left: 0; right: 0; border-top: 1.5px dashed var(--guide); }
  .cell .ch { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              font-family: 'Badasseugi'; color: var(--trace); line-height: 1; }
  #ink { position: absolute; touch-action: none; }
  #stage.erase #ink { cursor: crosshair; }

  /* 겹쳐 뜨는 화면 (시작, 고르기, 다 했다, 모음) */
  .screen { position: fixed; inset: 0; background: var(--bg); overflow: auto; padding: 22px 18px 40px; z-index: 10; }
  .screen .inner { max-width: 760px; margin: 0 auto; }
  .screen h1 { font-size: 26px; margin: 6px 0 6px; }
  .screen p { color: #555; line-height: 1.6; margin: 0 0 14px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .card label { display: block; font-size: 14px; margin: 8px 0 4px; color: #444; }
  .card input[type=text], .card select { width: 100%; font: inherit; font-size: 18px; padding: 10px; border: 1px solid #bbb; border-radius: 10px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1; min-width: 140px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .check input { width: 22px; height: 22px; }

  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
  .thumb { position: relative; background: #fff; border-radius: 10px; padding: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.15); cursor: pointer; }
  .thumb canvas { display: block; }
  .thumb.chosen { outline: 4px solid var(--warn); }
  .thumb .cap { font-size: 12px; color: #777; text-align: center; margin-top: 4px; }
  .wordgroup { margin-bottom: 14px; }
  .wordgroup h3 { font-size: 16px; margin: 0 0 8px; }

  .big { display: flex; justify-content: center; margin: 10px 0 18px; position: relative; }
  .stamp { display: inline-block; border: 4px solid var(--warn); color: var(--warn); border-radius: 50%;
           padding: 14px 18px; font-size: 22px; font-weight: 700; transform: rotate(-8deg); }
  .center { text-align: center; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>

<header class="bar">
  <button id="btnHome" aria-label="처음으로">☰</button>
  <div class="grow">
    <div class="model" id="model"></div>
  </div>
  <div class="prog" id="prog"></div>
  <button id="btnUndo">되돌리기</button>
  <button id="btnErase">지우개</button>
</header>

<main id="stage">
  <div id="sheet"></div>
  <canvas id="ink"></canvas>
</main>

<footer class="bar">
  <div class="grow hint" id="hint">흐린 글자를 따라 써 봐요.</div>
  <button class="primary" id="btnNext">다 썼어요 →</button>
</footer>

<!-- 시작 -->
<section class="screen" id="scrStart">
  <div class="inner">
    <h1>화면에 쓰기 <span class="muted">(시제품)</span></h1>
    <p>흐린 글자를 손가락이나 펜으로 따라 써요. 한 장을 다 쓰면 제일 잘 쓴 글자 하나를 골라요. 쓴 글씨는 이 기기에만 저장돼요.</p>
    <div class="card">
      <label for="inWords">오늘 쓸 낱말 (쉼표로 나누기)</label>
      <input type="text" id="inWords">
      <div class="row" style="margin-top:8px">
        <div>
          <label for="inStep">따라 쓰기 칸 (낱말 하나를 4번 써요)</label>
          <select id="inStep">
            <option value="3">흐린 글자 3번 + 빈칸 1번</option>
            <option value="2">흐린 글자 2번 + 빈칸 2번</option>
            <option value="1">흐린 글자 1번 + 빈칸 3번</option>
            <option value="0">모두 빈칸</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <label class="check"><input type="checkbox" id="inPenOnly"> 펜으로만 쓰기 (손바닥·손가락 무시)</label>
        </div>
      </div>
    </div>
    <div class="row">
      <button class="primary" id="btnStart">시작!</button>
      <button id="btnShowCol">내 글씨 모음</button>
      <button id="btnOtherWords">다른 낱말</button>
    </div>
    <p class="muted" style="margin-top:16px"><a href="../index.html">학습지 인쇄 사이트로</a></p>
  </div>
</section>

<!-- 고르기 -->
<section class="screen" id="scrPick" hidden>
  <div class="inner">
    <h1>제일 잘 쓴 글자는?</h1>
    <p>오늘 쓴 글자 중에서 제일 마음에 드는 글자 하나를 눌러요.</p>
    <div id="pickList"></div>
    <div class="row"><button id="btnBackToWrite">더 쓸래요</button></div>
  </div>
</section>

<!-- 다 했다 -->
<section class="screen" id="scrDone" hidden>
  <div class="inner center">
    <h1>다 했다!</h1>
    <div class="big"><canvas id="bigBest"></canvas></div>
    <p id="doneMsg"></p>
    <div class="row">
      <button class="primary" id="btnAgain">한 장 더</button>
      <button id="btnShowCol2">내 글씨 모음</button>
    </div>
  </div>
</section>

<!-- 모음 -->
<section class="screen" id="scrCol" hidden>
  <div class="inner">
    <h1>내 글씨 모음</h1>
    <p id="colMsg">한 장을 다 쓰고 고른 글자가 여기에 모여요.</p>
    <div class="thumbs" id="colList"></div>
    <div class="row" style="margin-top:18px"><button id="btnColBack">돌아가기</button></div>
  </div>
</section>

<script src="../data/words/game.js"></script>
<script src="trace.js"></script>
</body>
</html>
