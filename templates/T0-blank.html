<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빈칸 공책</title>
<link rel="stylesheet" href="common.css">
<style>
  .top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4mm; }
  .top h1 { margin: 0; font-size: 16pt; font-weight: 700; }
  .date { font-size: 10.5pt; }
  .grid { width: fit-content; margin: 0 auto; }
  .grid .cells + .cells { margin-top: -0.35mm; }   /* 위아래 칸 테두리 겹치기 */
</style>
</head>
<body>
<div class="screen-note"><a href="../index.html">← 처음으로</a><br>
  아무 글자 없는 빈칸 공책이에요. ⌘P → A4 · 배율 기본값으로 인쇄해요.
  주소 뒤에 <code>?cell=20</code>(칸 크기 mm, 15~35) · <code>?pages=2</code>(장 수) · <code>?title=편지</code>(제목)를 붙여 바꿀 수 있어요.
</div>
<div id="pages"></div>
<script>
const q = new URLSearchParams(location.search);
const cellMm = Math.max(15, Math.min(35, parseFloat(q.get('cell')) || parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 25));
const nPages = Math.max(1, Math.min(10, parseInt(q.get('pages') || '1', 10)));
const title = q.get('title') || '빈칸 공책';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// A4 세로, 여백 12mm → 쓸 수 있는 폭 186mm, 높이 273mm. 머리 줄(약 14mm)을 빼고 칸을 채운다.
// 이웃 칸은 테두리 0.35mm 를 겹치므로 n칸의 길이는 n*cell - (n-1)*0.35.
const fit = len => Math.floor((len - 0.35) / (cellMm - 0.35));
const cols = fit(186);
const rows = fit(273 - 16);
const row = `<div class="cells">${'<div class="cell"></div>'.repeat(cols)}</div>`;
const sheet = `<section class="sheet" style="--cell:${cellMm}mm">
  <div class="top"><h1>${esc(title)}</h1><div class="date">____월 ____일</div></div>
  <div class="grid">${row.repeat(rows)}</div>
</section>`;
document.getElementById('pages').innerHTML = sheet.repeat(nPages);
</script>
</body>
</html>
