<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빈칸 공책</title>
<link rel="stylesheet" href="common.css">
<style>
  .top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4mm; }
  .top h1 { margin: 0; font-size: 16pt; font-weight: 700; }
  .date { font-size: 10.5pt; }
  .grid { width: fit-content; margin: 0 auto; }
  .grid .cells + .cells { margin-top: -0.35mm; }   /* 위아래 칸 테두리 겹치기 */
</style>
</head>
<body>
<div class="screen-note"><a href="../index.html">← 처음으로</a><br>
  아무 글자 없는 빈칸 공책이에요. ⌘P → A4 · 배율 기본값으로 인쇄해요.<br>
  기본: <b>가로 용지 14칸 × 10줄</b>, <b>세로 용지 10칸 × 14줄</b>. 두 방향의 칸 크기가 같아요.
  주소 뒤에 <code>?dir=land</code>(가로 용지, 기본은 세로) · <code>?pages=2</code>(장 수) · <code>?title=편지</code>(제목)를 붙여 바꿀 수 있어요.
  <code>?cell=25</code>(칸 크기 mm, 15~35)를 주면 칸 수 대신 칸 크기를 고정하고 들어가는 만큼 채워요.
</div>
<div id="pages"></div>
<script>
const q = new URLSearchParams(location.search);
const fixedCell = parseFloat(q.get('cell'));                 // 비어 있으면 기본(14×10) 모드
const nPages = Math.max(1, Math.min(10, parseInt(q.get('pages') || '1', 10)));
const title = q.get('title') || '빈칸 공책';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 기본 칸 수: 긴 변 14칸, 짧은 변 10칸. 가로 용지는 14칸 × 10줄, 세로 용지는 10칸 × 14줄.
const LONG = 14, SHORT = 10;
const B = 0.35;                                              // 칸 테두리 두께(mm). 이웃 칸은 테두리를 겹친다.
const span = (n, cell) => n * cell - (n - 1) * B;            // n칸의 길이
const fit = (len, cell) => Math.floor((len - B) / (cell - B)); // len 안에 들어가는 칸 수

// 용지 방향: 세로(기본) 또는 가로(?dir=land).
// A4 여백 12mm → 세로는 쓸 수 있는 폭 186mm·높이 273mm, 가로는 폭 273mm·높이 186mm.
const land = /^(land|landscape|가로)$/.test(q.get('dir') || '');
const pageW = land ? 297 : 210, pageH = land ? 210 : 297;
const usableW = pageW - 24, usableH = pageH - 24;
const st = document.createElement('style');
st.textContent = `@page { size: A4 ${land ? 'landscape' : 'portrait'}; margin: 12mm; }
  .sheet { width: ${usableW}mm; }
  @media screen { .sheet, .screen-note { width: ${pageW}mm; } .sheet { min-height: ${pageH}mm; } }`;
document.head.appendChild(st);
document.title = `빈칸 공책 (${land ? '가로' : '세로'})`;

const head = `<div class="top"><h1>${esc(title)}</h1><div class="date">____월 ____일</div></div>`;

// 제목 글꼴을 받은 다음 머리 줄 높이를 실제로 재서(mm) 칸 크기·줄 수를 정한다. 다음 장으로 넘치지 않게 1mm 여유를 둔다.
Promise.all([document.fonts.load('700 16pt Bareun'), document.fonts.load('10.5pt Bareun')]).catch(() => {}).then(build);
function build() {
  const probe = document.createElement('section');
  probe.className = 'sheet'; probe.style.cssText = 'position:absolute; visibility:hidden; padding:0; min-height:0;';
  probe.innerHTML = head;
  document.body.appendChild(probe);
  const top = probe.querySelector('.top');
  const headMm = (top.getBoundingClientRect().height + parseFloat(getComputedStyle(top).marginBottom)) / (96 / 25.4);
  probe.remove();

  let cell, cols, rows;
  if (fixedCell) {
    cell = Math.max(15, Math.min(35, fixedCell));
    cols = fit(usableW, cell);
    rows = fit(usableH - headMm - 1, cell);
  } else {
    // 칸 크기는 「가로 용지 14칸 × 10줄」이 들어가는 가장 큰 값(0.1mm 단위)으로 정하고, 세로 용지도 같은 크기를 쓴다.
    const landW = 297 - 24, landH = 210 - 24 - headMm - 1;
    const maxCell = Math.min((landW + (LONG - 1) * B) / LONG, (landH + (SHORT - 1) * B) / SHORT);
    cell = Math.floor(maxCell * 10) / 10;
    cols = land ? LONG : SHORT;
    rows = land ? SHORT : LONG;
  }
  const row = `<div class="cells">${'<div class="cell"></div>'.repeat(cols)}</div>`;
  const sheet = `<section class="sheet" style="--cell:${cell}mm" data-cell="${cell}">${head}
    <div class="grid">${row.repeat(rows)}</div>
  </section>`;
  document.getElementById('pages').innerHTML = sheet.repeat(nPages);
}
</script>
</body>
</html>
